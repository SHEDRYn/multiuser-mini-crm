version: '3.8'

services:
  db:
    image: postgres:14-alpine
    container_name: crm_db
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
      POSTGRES_DB: crm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: crm_api
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://crm_user:crm_password@db:5432/crm_db
      DATABASE_URL_SYNC: postgresql://crm_user:crm_password@db:5432/crm_db
      SECRET_KEY: development-secret-key-change-in-production
      DEBUG: "True"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:

